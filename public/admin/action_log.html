<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Action Logs - Demo Launcher Admin</title>
  <link rel="stylesheet" href="/main.css" />
</head>

<body>
  <div class="container container-wide">
    <admin-nav></admin-nav>

    <h1>Action Logs Audit Trail</h1>

    <!-- Main Content (Metrics + Controls + Table) -->
    <div id="main-content">
      <!-- Metric Summary -->
      <div class="status-box">
        <p>
          <strong>Total Actions:</strong> <span id="metric-total">-</span> |
          <strong>Queued:</strong> <span id="metric-queued">-</span> |
          <strong>Rejected:</strong> <span id="metric-rejected">-</span> |
          <strong>Unique IPs:</strong> <span id="metric-unique-ips">-</span>
        </p>
      </div>

      <!-- Controls & Search -->
      <div
        style="margin: 16px 0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
        <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center;">
          <input type="text" id="filter-search" placeholder="Search IP, Project, Agent..." />
          <select id="filter-action">
            <option value="">All Actions</option>
            <option value="LAUNCH_DEMO">LAUNCH_DEMO</option>
            <option value="STOP_DEMO">STOP_DEMO</option>
          </select>
          <select id="filter-status">
            <option value="">All Statuses</option>
            <option value="QUEUED">QUEUED</option>
            <option value="REJECTED">REJECTED</option>
            <option value="SUCCESS">SUCCESS</option>
            <option value="FAILED">FAILED</option>
          </select>
          <select id="filter-project">
            <option value="">All Projects</option>
          </select>
        </div>

        <div style="display: flex; gap: 12px; align-items: center;">
          <label style="font-size: 13px;">
            <input type="checkbox" id="auto-refresh-check" />
            Auto-refresh (5s)
          </label>
          <button type="button" id="refresh-btn">
            <span id="refresh-icon"></span>Refresh
          </button>
        </div>
      </div>

      <!-- Action Logs Table Container -->
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Timestamp</th>
              <th>Action</th>
              <th>Status</th>
              <th>Project ID</th>
              <th>Client IP &amp; Country</th>
              <th>User Agent</th>
              <th>Details</th>
            </tr>
          </thead>
          <tbody id="logs-tbody">
            <tr>
              <td colspan="7">Loading action logs...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Pagination Controls -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 12px;">
        <div id="pagination-info" style="font-size: 13px; color: #444;">Showing 0 of 0 logs</div>
        <div style="display: flex; gap: 6px;">
          <button type="button" id="prev-page-btn" class="btn-sm" disabled>&larr; Previous</button>
          <button type="button" id="next-page-btn" class="btn-sm" disabled>Next &rarr;</button>
        </div>
      </div>
    </div>

    <!-- Inspector Modal -->
    <div id="details-modal" class="modal-overlay hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="modal-title">Action Log Details</h3>
          <button type="button" id="modal-close-btn" class="btn-sm">&times;</button>
        </div>
        <div class="modal-body">
          <pre id="modal-json" class="json-viewer"></pre>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/admin/navbar.js"></script>
  <script type="module" src="/admin/admin.js"></script>
</body>

</html>
