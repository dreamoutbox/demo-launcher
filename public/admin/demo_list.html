<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo List - Demo Launcher Admin</title>
  <link rel="stylesheet" href="/main.css" />
</head>

<body>
  <div class="container container-wide">
    <admin-nav></admin-nav>

    <h1>Demo List</h1>

    <div class="table-toolbar">
      <span id="demo-list-status" class="toolbar-message">Loading demos...</span>
      <button type="button" id="refresh-btn">Refresh</button>
    </div>

    <!-- Manual Demo Cleanup Form -->
    <div class="status-box">
      <strong>Manual Demo Cleanup:</strong>
      <form id="cleanup-form" style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px;">
        <label for="cleanup-seconds-input" style="font-size: 13px;">Max Demo Time (seconds):</label>
        <input type="number" id="cleanup-seconds-input" name="maxDemoTimeSeconds" min="0" placeholder="e.g. 2"
          style="width: 100px;" value="1" />
        <button type="submit" id="cleanup-submit-btn">Run Cleanup</button>
        <span id="cleanup-status-msg" style="font-size: 13px; color: #555;"></span>
      </form>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Project</th>
            <th>Status</th>
            <th>Droplet ID</th>
            <th>Droplet IP</th>
            <th>Tags</th>
            <th>Launched At</th>
            <th>Uptime</th>
            <th>Repository</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="demo-tbody">
          <tr>
            <td colspan="9">Loading demo projects...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module" src="/admin/navbar.js"></script>
  <script type="module" src="/admin/demo_list.js"></script>
</body>

</html>
